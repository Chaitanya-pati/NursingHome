<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Subramanya Home Healthcare — Employee ID Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ─── Page ─── */
    body {
      font-family: 'Poppins', sans-serif;
      background: #dce8f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 40px 20px;
    }

    .page-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #7a9abf;
      font-weight: 500;
    }

    /* ═══════════════════════════════
       CARD  —  CR80: 54mm × 86mm
       Screen preview at 1.7× scale:
       ≈ 324 × 516 px
    ═══════════════════════════════ */
    .card {
      position: relative;
      width: 324px;
      min-height: 516px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(8, 78, 155, 0.18),
        0  4px 16px rgba(0, 0, 0, 0.10);
      display: flex;
      flex-direction: column;
    }

    /* ─── Hexagon watermark — top-right corner only ─── */
    .hex-top-right {
      position: absolute;
      top: 0; right: 0;
      width: 160px;
      height: 160px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .hex-top-right svg { position: absolute; top: -10px; right: -10px; }

    /* ─── Hexagon watermark — bottom-right corner only ─── */
    .hex-bottom-right {
      position: absolute;
      bottom: 0; right: 0;
      width: 140px;
      height: 140px;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .hex-bottom-right svg { position: absolute; bottom: -10px; right: -10px; }

    /* ─── Lanyard hole ─── */
    .lanyard {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding-top: 12px;
      padding-bottom: 4px;
    }
    .lanyard-slot {
      width: 38px;
      height: 11px;
      background: #ccd8e8;
      border-radius: 6px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.22);
    }

    /* ─── Header ─── */
    .card-header {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 16px 12px;
      border-bottom: 1.5px solid #DCEEFF;
    }
    .header-logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .header-company {
      font-size: 15px;
      font-weight: 900;
      color: #0B66C3;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.1;
      text-align: center;
    }
    .header-sub {
      font-size: 8.5px;
      font-weight: 700;
      color: #084E9B;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 2px;
    }
    .header-tagline {
      font-size: 8px;
      font-weight: 400;
      color: #6a8fbf;
      font-style: italic;
      text-align: center;
      margin-top: 3px;
    }

    /* ─── Photo ─── */
    .photo-section {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 18px 0 8px;
    }
    .photo-ring {
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 3px solid #0B66C3;
      padding: 3px;
      background: #fff;
    }
    .photo-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .photo-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: linear-gradient(145deg, #DCEEFF, #b8d4f0);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-placeholder svg {
      width: 52px;
      height: 52px;
      fill: #7aaad4;
    }

    /* ─── Name ─── */
    .name-section {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 4px 12px 0;
    }
    .emp-name {
      font-size: 22px;
      font-weight: 800;
      color: #084E9B;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    /* ─── Role + ECG ─── */
    .role-section {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 5px 10px 10px;
    }
    .ecg-arm {
      flex: 1;
      height: 20px;
      max-width: 72px;
    }
    .role-label {
      font-size: 9.5px;
      font-weight: 700;
      color: #4CAF50;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      padding: 0 8px;
    }

    /* ─── Info divider ─── */
    .info-divider {
      position: relative;
      z-index: 2;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #DCEEFF 20%, #DCEEFF 80%, transparent 100%);
      margin: 0 14px 2px;
    }

    /* ─── Info rows ─── */
    .info-section {
      position: relative;
      z-index: 2;
      padding: 8px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-icon {
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #0B66C3, #084E9B);
      border-radius: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .info-icon svg {
      width: 12px;
      height: 12px;
      fill: #fff;
    }
    .info-label {
      font-size: 9.5px;
      font-weight: 500;
      color: #2a4a7a;
      width: 68px;
      flex-shrink: 0;
    }
    .info-colon {
      font-size: 9.5px;
      font-weight: 600;
      color: #2a4a7a;
      flex-shrink: 0;
      margin-right: 2px;
    }
    .info-value {
      font-size: 9.5px;
      font-weight: 600;
      color: #0d1f3c;
      flex: 1;
    }

    /* ─── Footer ─── */
    .card-footer {
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, #084E9B 0%, #0B66C3 60%, #1a82e0 100%);
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .footer-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .footer-icon svg { width: 13px; height: 13px; fill: rgba(255,255,255,0.9); }
    .footer-text {
      font-size: 9px;
      font-weight: 500;
      color: #fff;
      letter-spacing: 0.3px;
    }

    /* ═══════════════════════════════
       PRINT STYLES  (54mm × 86mm)
    ═══════════════════════════════ */
    @media print {
      body {
        background: #fff;
        padding: 0;
        display: block;
      }
      .page-label,
      .print-btn { display: none !important; }

      .card {
        width: 54mm;
        min-height: 86mm;
        box-shadow: none;
        border-radius: 4mm;
        page-break-inside: avoid;
        margin: 0 auto;
        font-size: 62%;
      }
      .emp-name     { font-size: 11pt; }
      .header-company { font-size: 7pt; }
      .header-sub   { font-size: 4.5pt; }
      .card-footer  { padding: 5px 8px 7px; }
      .photo-ring   { width: 54px; height: 54px; }
      .info-icon    { width: 13px; height: 13px; }
      .info-icon svg { width: 7px; height: 7px; }
      .info-label, .info-colon, .info-value { font-size: 5pt; }
      .footer-text  { font-size: 4.5pt; }
    }

    /* ─── Print button ─── */
    .print-btn {
      font-family: 'Poppins', sans-serif;
      background: #0B66C3;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 32px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 14px rgba(11,102,195,0.35);
      transition: background 0.2s;
    }
    .print-btn:hover { background: #084E9B; }
  </style>
</head>
<body>

  <p class="page-label">Subramanya Home Healthcare — Employee ID Card</p>

  <div class="card">

    <!-- Hexagon pattern: top-right -->
    <div class="hex-top-right">
      <svg width="170" height="170" viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hexTop" x="0" y="0" width="34" height="30" patternUnits="userSpaceOnUse">
            <polygon points="17,1 33,9.5 33,20.5 17,29 1,20.5 1,9.5"
              fill="none" stroke="#DCEEFF" stroke-width="1.2"/>
          </pattern>
        </defs>
        <rect width="170" height="170" fill="url(#hexTop)"/>
      </svg>
    </div>

    <!-- Hexagon pattern: bottom-right -->
    <div class="hex-bottom-right">
      <svg width="150" height="150" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hexBot" x="0" y="0" width="34" height="30" patternUnits="userSpaceOnUse">
            <polygon points="17,1 33,9.5 33,20.5 17,29 1,20.5 1,9.5"
              fill="none" stroke="#DCEEFF" stroke-width="1.2"/>
          </pattern>
        </defs>
        <rect width="150" height="150" fill="url(#hexBot)"/>
      </svg>
    </div>

    <!-- Lanyard hole -->
    <div class="lanyard"><div class="lanyard-slot"></div></div>

    <!-- Header -->
    <div class="card-header">
      <img class="header-logo"
           src="/Images/subramanya_latest-Logo.jpg"
           alt="Subramanya Logo"
           onerror="this.src='/Images/Subramanya.png'"/>
      <div class="header-company">Subramanya</div>
      <div class="header-sub">Home Healthcare Service</div>
      <div class="header-tagline">Your Care, Our Commitment</div>
    </div>

    <!-- Photo -->
    <div class="photo-section">
      <div class="photo-ring">
        <img src="/Images/priya_nair.png" alt="Priya Nair"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
        <div class="photo-placeholder" style="display:none">
          <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
            <circle cx="40" cy="28" r="18"/>
            <ellipse cx="40" cy="70" rx="28" ry="18"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Name -->
    <div class="name-section">
      <div class="emp-name">Priya Nair</div>
    </div>

    <!-- Role + ECG heartbeat -->
    <div class="role-section">
      <!-- ECG left -->
      <svg class="ecg-arm" viewBox="0 0 72 20" xmlns="http://www.w3.org/2000/svg">
        <polyline
          points="0,10 20,10 24,10 27,4 30,16 33,2 36,18 39,10 44,10 72,10"
          fill="none" stroke="#0B66C3" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <span class="role-label">Helper</span>

      <!-- ECG right -->
      <svg class="ecg-arm" viewBox="0 0 72 20" xmlns="http://www.w3.org/2000/svg">
        <polyline
          points="0,10 28,10 33,10 36,4 39,16 42,2 45,18 48,10 52,10 72,10"
          fill="none" stroke="#0B66C3" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Info divider -->
    <div class="info-divider"></div>

    <!-- Info rows -->
    <div class="info-section">

      <!-- ID No. -->
      <div class="info-row">
        <div class="info-icon">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </div>
        <span class="info-label">ID No.</span>
        <span class="info-colon">:</span>
        <span class="info-value">SHHS2991</span>
      </div>

      <!-- Role -->
      <div class="info-row">
        <div class="info-icon">
          <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.44.18-.88.18-1.34C18 2.55 15.45 1 12 1S6 2.55 6 4.66c0 .46.11.9.18 1.34H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-8-3c1.8 0 3 .78 3 1.66 0 .88-1.2 1.67-3 1.67S9 5.54 9 4.66C9 3.78 10.2 3 12 3zm8 16H4V8h16v11z"/><circle cx="12" cy="13" r="2"/></svg>
        </div>
        <span class="info-label">Role</span>
        <span class="info-colon">:</span>
        <span class="info-value">Helper</span>
      </div>

      <!-- DOB -->
      <div class="info-row">
        <div class="info-icon">
          <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
        </div>
        <span class="info-label">DOB</span>
        <span class="info-colon">:</span>
        <span class="info-value">02-12-1996</span>
      </div>

      <!-- Mobile -->
      <div class="info-row">
        <div class="info-icon">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        </div>
        <span class="info-label">Mobile No.</span>
        <span class="info-colon">:</span>
        <span class="info-value">96325 47890</span>
      </div>

      <!-- Aadhar -->
      <div class="info-row">
        <div class="info-icon">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
        </div>
        <span class="info-label">Aadhar No.</span>
        <span class="info-colon">:</span>
        <span class="info-value">4567 8901 2345</span>
      </div>

    </div><!-- /.info-section -->

    <!-- Footer -->
    <div class="card-footer">
      <div class="footer-row">
        <div class="footer-icon">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
        </div>
        <span class="footer-text">+91 90360 39555</span>
      </div>
      <div class="footer-row">
        <div class="footer-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93s3.05-7.44 7-7.93v15.86zm2 0V4.07c3.95.49 7 3.85 7 7.93s-3.05 7.44-7 7.93z"/></svg>
        </div>
        <span class="footer-text">www.subramanyahomehealthcare.com</span>
      </div>
    </div>

  </div><!-- /.card -->

  <button class="print-btn" onclick="window.print()">🖨 &nbsp;Print / Save as PDF</button>

</body>
</html>
